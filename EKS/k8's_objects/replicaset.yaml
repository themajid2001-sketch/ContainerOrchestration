apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: customer
  #namespace: appserver
  labels:
    app: packersmovers
spec:
  replicas: 2
  #minReadySeconds: 10
  selector:
    matchLabels:
      app: packersmovers
  template:
    metadata:
      labels:
        app: packersmovers
    spec:
      containers:
      - name: customer
        image: public.ecr.aws/b0k7t8o2/customer:1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
