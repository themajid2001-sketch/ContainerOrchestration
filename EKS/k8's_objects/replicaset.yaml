apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: driver
  #namespace: appserver
  labels:
    app: packersmovers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: packersmovers
  template:
    metadata:
      labels:
        app: packersmovers
    spec:
      containers:
      - name: driver
        image: 357021375224.dkr.ecr.us-east-2.amazonaws.com/driver
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
