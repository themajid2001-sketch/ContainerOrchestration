apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: driver
  #namespace: appserver
  labels:
    app: packersmovers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: packersmovers
  template:
    metadata:
      labels:
        app: packersmovers
    spec:
      containers:
      - name: driver
        image: public.ecr.aws/b0k7t8o2/driver:1
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
